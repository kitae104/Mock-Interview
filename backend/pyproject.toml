[project]
name = "mock-interview-backend"
version = "0.1.0"
description = "FastAPI 백엔드 (JWT 로그인·회원가입, PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20",
    "pyjwt>=2.15",
    "bcrypt>=5",
    "pydantic-settings>=2.15",
    "email-validator>=2.3",
    "httpx>=0.28",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
