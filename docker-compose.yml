# 프로젝트 하나 = Compose 프로젝트 하나.
# 컨테이너, 네트워크, 볼륨 이름이 모두 COMPOSE_PROJECT_NAME 으로 시작하므로
# 같은 PC의 다른 프로젝트와 섞이지 않고, 이 프로젝트만 한 번에 올리고 내릴 수 있습니다.
name: ${COMPOSE_PROJECT_NAME:-mock-interview}

services:
  db:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mock-interview}-db
    environment:
      POSTGRES_DB: ${DB_NAME:-mock_interview}
      POSTGRES_USER: ${DB_USERNAME:-mock_interview}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mock_interview}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql 을 마운트합니다 (데이터는 18/docker 하위).
      - db-data:/var/lib/postgresql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    image: ${COMPOSE_PROJECT_NAME:-mock-interview}-backend
    container_name: ${COMPOSE_PROJECT_NAME:-mock-interview}-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USERNAME:-mock_interview}:${DB_PASSWORD:-mock_interview}@db:5432/${DB_NAME:-mock_interview}
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 을 설정하세요}
      JWT_ACCESS_TOKEN_VALIDITY_SECONDS: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:-3600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://localhost:5173}
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}
      INTERVIEW_MAX_ANSWER_SECONDS: ${INTERVIEW_MAX_ANSWER_SECONDS:-120}
      INTERVIEW_MAX_AUDIO_MB: ${INTERVIEW_MAX_AUDIO_MB:-25}
      INTERVIEW_DAILY_LIMIT: ${INTERVIEW_DAILY_LIMIT:-20}
      INTERVIEW_AI_RATE_PER_MINUTE: ${INTERVIEW_AI_RATE_PER_MINUTE:-20}
      INTERVIEW_DEFAULT_PREP_SECONDS: ${INTERVIEW_DEFAULT_PREP_SECONDS:-10}
      INTERVIEW_CONSENT_VERSION: ${INTERVIEW_CONSENT_VERSION:-2026-10-v1}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - app-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ${COMPOSE_PROJECT_NAME:-mock-interview}-frontend
    container_name: ${COMPOSE_PROJECT_NAME:-mock-interview}-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    networks:
      - app-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-net:
    name: ${COMPOSE_PROJECT_NAME:-mock-interview}-net

volumes:
  db-data:
    name: ${COMPOSE_PROJECT_NAME:-mock-interview}-db-data
