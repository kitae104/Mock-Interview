server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 내부 DNS 로 요청 때마다(10초 캐시) 이름을 다시 찾습니다.
    # 변수로 proxy_pass 해야 backend 컨테이너를 다시 만들어 IP 가 바뀌어도 502 가 나지 않습니다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # AI 응답은 오래 걸릴 수 있어 기본 60초보다 길게 기다립니다 (Ollama 첫 모델 로딩 등).
    location /api/ai/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;  # 포트까지 전달 (FRONTEND_PORT 를 바꿔도 같은 출처로 인식)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 라우팅: 없는 경로는 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
